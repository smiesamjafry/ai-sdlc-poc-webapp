# ASDLC tests stage. Started only by the ASDLC orchestrator (GitHub App) via workflow_dispatch.
#
#   write-tests  claims the execution with OIDC, then Claude Code writes Playwright tests.
#                Read-only repo access; Claude reaches Anthropic only through the ASDLC
#                metering proxy with a per-run token, and runs without the job's OIDC or
#                Actions runtime credentials.
#   verify       no AI. Fresh checkout at the same base commit, trusted harness from the
#                ASDLC repo, lints the files and runs the red check, reports with OIDC.
# The orchestrator commits accepted tests to ai/<ticket> itself; this workflow never pushes.
name: asdlc-tests
run-name: "asdlc tests ${{ inputs.ticket }} ${{ inputs.execution }}"

on:
  workflow_dispatch:
    inputs:
      execution: { description: "ASDLC execution id", required: true, type: string }
      ticket: { description: "Ticket id", required: true, type: string }
      server: { description: "ASDLC orchestrator base URL", required: true, type: string }
      harness_ref: { description: "ASDLC harness ref", required: true, type: string }

permissions: {}

concurrency:
  group: asdlc-${{ inputs.ticket }}
  cancel-in-progress: false

env:
  EXECUTION: ${{ inputs.execution }}
  TICKET: ${{ inputs.ticket }}
  SERVER: ${{ inputs.server }}
  CLAUDE_CODE_VERSION: 2.1.286

jobs:
  write-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      base_sha: ${{ steps.claim.outputs.base_sha }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$EXECUTION" =~ ^E-[0-9a-f-]{36}$ ]] || { echo "bad execution id"; exit 1; }
          [[ "$TICKET" =~ ^T-[0-9]+$ ]] || { echo "bad ticket id"; exit 1; }
          [[ "$SERVER" =~ ^https:// ]] || { echo "server must be https"; exit 1; }

      - name: Claim execution
        id: claim
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=asdlc" | jq -r .value)
          curl -sS --fail-with-body -X POST "$SERVER/github/claim" \
            -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' \
            -d "{\"execution\":\"$EXECUTION\"}" -o "$RUNNER_TEMP/claim.json"
          TOKEN=$(jq -r .token "$RUNNER_TEMP/claim.json")
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/proxy-token"
          jq .spec "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/spec.json"
          echo "base_sha=$(jq -r .baseSha "$RUNNER_TEMP/claim.json")" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/claim.json"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.claim.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: smiesamjafry/ai-sdlc
          ref: ${{ inputs.harness_ref }}
          path: .asdlc-harness
          persist-credentials: false
          sparse-checkout: harness

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Write tests with Claude Code
        env:
          ASDLC_TEST_DIR: e2e/asdlc/${{ inputs.ticket }}
        run: |
          set -uo pipefail
          mkdir -p .asdlc "$ASDLC_TEST_DIR"
          cp "$RUNNER_TEMP/spec.json" .asdlc/spec.json
          PROMPT=$(sed "s/{{TICKET}}/$TICKET/g" .asdlc-harness/harness/prompts/write-tests.md)
          KEY=$(cat "$RUNNER_TEMP/proxy-token"); rm "$RUNNER_TEMP/proxy-token"
          # Model-run commands get no OIDC, artifact or cache credentials from this job.
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL -u ACTIONS_CACHE_URL -u GITHUB_TOKEN \
            ANTHROPIC_BASE_URL="$SERVER/llm" ANTHROPIC_API_KEY="$KEY" \
            ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-5-5 ANTHROPIC_SMALL_FAST_MODEL=claude-haiku-5-5 \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 DISABLE_TELEMETRY=1 DISABLE_AUTOUPDATER=1 \
            npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" -p "$PROMPT" \
              --model claude-sonnet-5-5 --max-turns 40 \
              --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npx playwright test:*)" \
            || echo "::warning::Claude Code exited with $?"
          unset KEY

      - uses: actions/upload-artifact@v4
        with:
          name: asdlc-tests
          path: e2e/asdlc/${{ inputs.ticket }}/
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs: write-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.write-tests.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: smiesamjafry/ai-sdlc
          ref: ${{ inputs.harness_ref }}
          path: .asdlc-harness
          persist-credentials: false
          sparse-checkout: harness

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: asdlc-tests
          path: e2e/asdlc/${{ inputs.ticket }}/

      - name: Red check and report
        run: node .asdlc-harness/harness/verify.mjs
