name: PR preview
# Builds with a read-only token; only the publish job can write to gh-pages, and it
# runs no code from the pull request (it only copies the built artifact).
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: dist
          retention-days: 1
  publish:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: preview
          path: dist
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
