name: PR preview
# Builds with a read-only token; only the publish job can write to gh-pages, and it
# runs no code from the pull request (it only copies the built artifact).
#
# The preview SPA talks to the production API, which allows GitHub Pages only anonymous
# GET (browse the catalog; sign-in and checkout are blocked). A PR whose title contains
# [render preview] gets a Render preview environment instead, and this preview points at it.
#
# `edited` is here only for title changes ([render preview]). ASDLC opens a PR and then edits its
# description to add the preview link; that edit must not cancel the "opened" deploy, so
# description-only edits get their own concurrency group and build nothing.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
concurrency:
  group: preview-${{ github.event.number }}-${{ github.event.action == 'edited' && !github.event.changes.title && 'description' || 'deploy' }}
  cancel-in-progress: true
env:
  PROD_API_URL: ${{ vars.PROD_API_URL || 'https://pocket-shop-api.onrender.com' }}
jobs:
  build:
    if: github.event.action != 'closed' && (github.event.action != 'edited' || github.event.changes.title)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pick the API this preview talks to
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          backend=$(git diff --name-only "$BASE"...HEAD | grep -E '^(server/|shared/|render\.yaml$|package(-lock)?\.json$)' || true)
          api="$PROD_API_URL"
          if [[ "$TITLE" == *"[render preview]"* ]]; then
            candidate="https://pocket-shop-api-pr-$NUMBER.onrender.com"
            echo "Waiting for the Render preview API at $candidate"
            for i in $(seq 1 60); do
              if curl -sf "$candidate/healthz" > /dev/null; then api="$candidate"; break; fi
              sleep 10
            done
            [[ "$api" == "$candidate" ]] || echo "::warning::Render preview API never became healthy; using production."
          elif [[ -n "$backend" ]]; then
            echo "::warning::This PR changes backend files but the preview uses the production API. Add [render preview] to the title for a full-stack preview."
            printf '%s\n' "$backend"
          fi
          echo "VITE_API_URL=$api" >> "$GITHUB_ENV"
          echo "Preview API: $api" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          VITE_PREVIEW: "1"
          VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: dist
          retention-days: 1
  publish:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: preview
          path: dist
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Explicit: the action's "auto" mode ignores `edited`, so a title change would deploy nothing.
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
