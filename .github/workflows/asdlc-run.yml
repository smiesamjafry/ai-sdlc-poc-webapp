# ASDLC agent run (tests, build, fix). Started only by the ASDLC orchestrator (GitHub App) via
# workflow_dispatch. The orchestrator decides the stage, model, tools and prompt; this file only
# decides what each job is allowed to touch.
#
#   agent   claims the execution with OIDC, then Claude Code edits a checkout of the start commit.
#           Read-only repo access; Anthropic only through the ASDLC metering proxy with a per-run
#           token. Output: a patch, never a push.
#   check   no credentials of any kind. Applies the patch to a fresh checkout, enforces the path
#           rules and runs the acceptance tests (+ unit tests and typecheck for build/fix).
#   report  OIDC only, runs no agent code: reads the changed files from the patch and posts them
#           with the check results. The orchestrator commits to ai/<ticket> and opens the PR.
name: asdlc-run
run-name: "asdlc ${{ inputs.ticket }} ${{ inputs.execution }}"

on:
  workflow_dispatch:
    inputs:
      execution: { description: "ASDLC execution id", required: true, type: string }
      ticket: { description: "Ticket id", required: true, type: string }
      server: { description: "ASDLC orchestrator base URL", required: true, type: string }

permissions: {}

concurrency:
  group: asdlc-${{ inputs.ticket }}
  cancel-in-progress: false

env:
  EXECUTION: ${{ inputs.execution }}
  TICKET: ${{ inputs.ticket }}
  SERVER: ${{ inputs.server }}
  CLAUDE_CODE_VERSION: 2.1.286
  # Writes the orchestrator's harness ({ref, files: {path: text}}) under .asdlc-harness/.
  WRITE_HARNESS: |
    const fs = require("fs"), path = require("path");
    const h = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
    for (const [f, text] of Object.entries(h.files)) {
      if (!/^harness\/[\w./-]+$/.test(f) || f.includes("..")) throw new Error("bad harness path " + f);
      const out = path.join(".asdlc-harness", f);
      fs.mkdirSync(path.dirname(out), { recursive: true });
      fs.writeFileSync(out, text);
    }
    console.log("harness", h.ref, Object.keys(h.files).join(", "));

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    outputs:
      start_sha: ${{ steps.claim.outputs.start_sha }}
      stage: ${{ steps.claim.outputs.stage }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$EXECUTION" =~ ^E-[0-9a-f-]{36}$ ]] || { echo "bad execution id"; exit 1; }
          [[ "$TICKET" =~ ^T-[0-9]+$ ]] || { echo "bad ticket id"; exit 1; }
          [[ "$SERVER" =~ ^https:// ]] || { echo "server must be https"; exit 1; }

      - name: Claim execution
        id: claim
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=asdlc" | jq -r .value)
          curl -sS --fail-with-body -X POST "$SERVER/github/claim" \
            -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' \
            -d "{\"execution\":\"$EXECUTION\"}" -o "$RUNNER_TEMP/claim.json"
          TOKEN=$(jq -r .token "$RUNNER_TEMP/claim.json")
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/proxy-token"
          jq .spec "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/spec.json"
          jq .harness "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/harness.json"
          jq -r .agent.prompt "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/prompt.md"
          jq -r '.agent.model' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/model"
          jq -r '.agent.maxTurns' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/max-turns"
          jq -r '.agent.allowedTools' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/allowed-tools"
          echo "start_sha=$(jq -r .startSha "$RUNNER_TEMP/claim.json")" >> "$GITHUB_OUTPUT"
          echo "stage=$(jq -r .stage "$RUNNER_TEMP/claim.json")" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/claim.json"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.claim.outputs.start_sha }}
          persist-credentials: false

      - name: Install harness
        run: node -e "$WRITE_HARNESS" "$RUNNER_TEMP/harness.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        run: |
          set -uo pipefail
          mkdir -p .asdlc "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/spec.json" .asdlc/spec.json
          KEY=$(cat "$RUNNER_TEMP/proxy-token"); rm "$RUNNER_TEMP/proxy-token"
          # Commands the model runs get no OIDC, artifact or cache credentials from this job.
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL -u ACTIONS_CACHE_URL -u GITHUB_TOKEN \
            ANTHROPIC_BASE_URL="$SERVER/llm" ANTHROPIC_API_KEY="$KEY" \
            ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-5-5 ANTHROPIC_SMALL_FAST_MODEL=claude-haiku-5-5 \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 DISABLE_TELEMETRY=1 DISABLE_AUTOUPDATER=1 \
            ASDLC_TEST_DIR="e2e/asdlc/$TICKET" \
            npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" -p "$(cat "$RUNNER_TEMP/prompt.md")" \
              --model "$(cat "$RUNNER_TEMP/model")" --max-turns "$(cat "$RUNNER_TEMP/max-turns")" \
              --allowedTools "$(cat "$RUNNER_TEMP/allowed-tools")" --output-format json \
              > "$RUNNER_TEMP/claude.json" || echo "::warning::Claude Code exited with $?"
          unset KEY
          jq -r '.result // ""' "$RUNNER_TEMP/claude.json" > "$RUNNER_TEMP/out/summary.md" || true
          jq '{subtype, num_turns, duration_ms, is_error}' "$RUNNER_TEMP/claude.json" || true

      - name: Package changes as a patch
        run: |
          printf '.asdlc/\n.asdlc-harness/\ntest-results/\nplaywright-report/\n' >> .git/info/exclude
          git add -A
          git diff --cached --binary HEAD > "$RUNNER_TEMP/out/changes.patch"
          git diff --cached --stat HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: ${{ runner.temp }}/out/
          retention-days: 14

  check:
    name: check
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STAGE: ${{ needs.agent.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.start_sha }}
          persist-credentials: false

      - name: Fetch trusted harness
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$SERVER/github/harness" -o "$RUNNER_TEMP/harness.json"
          node -e "$WRITE_HARNESS" "$RUNNER_TEMP/harness.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent

      - name: Apply patch and run checks
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          PATCH="$RUNNER_TEMP/agent/changes.patch" OUT="$RUNNER_TEMP/check" \
            node .asdlc-harness/harness/run.mjs check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-output
          path: ${{ runner.temp }}/check/check.json
          retention-days: 14

  report:
    name: report
    needs: [agent, check]
    if: always() && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: ${{ needs.agent.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.start_sha }}
          persist-credentials: false

      - name: Fetch trusted harness
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$SERVER/github/harness" -o "$RUNNER_TEMP/harness.json"
          node -e "$WRITE_HARNESS" "$RUNNER_TEMP/harness.json"

      - uses: actions/download-artifact@v4
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: check-output
          path: ${{ runner.temp }}/check

      - name: Report to ASDLC
        run: |
          PATCH="$RUNNER_TEMP/agent/changes.patch" OUT="$RUNNER_TEMP/check" SUMMARY="$RUNNER_TEMP/agent/summary.md" \
            node .asdlc-harness/harness/run.mjs report
