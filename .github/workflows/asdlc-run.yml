# ASDLC agent run (tests, build, fix). Copy to .github/workflows/asdlc-run.yml in the target
# repo, on its default branch. Started only by the ASDLC orchestrator (GitHub App) via
# workflow_dispatch. The orchestrator decides the stage, model, tools, prompt and the project
# profile (.asdlc/profile.yml, pinned per ticket); this file only decides what each job may touch.
# Nothing in it is project-specific: setup, services, app start and checks come from the profile.
#
#   agent   claims the execution with OIDC, runs the profile's setup, starts its services, then
#           Claude Code edits a checkout of the start commit. Read-only repo access; Anthropic
#           only through the ASDLC metering proxy with a per-run token. Output: a patch.
#   check   no credentials of any kind. Applies the patch to a fresh checkout, enforces the path
#           rules, starts services and the app, runs the acceptance tests and the profile's checks.
#   report  OIDC only, runs no agent code: reads the changed files from the patch and posts them
#           with the check results. The orchestrator commits to ai/<ticket> and opens the PR.
#
# Every profile command runs with OIDC, GitHub and Anthropic variables removed from its
# environment (harness/run.mjs). Runner toolchains (Node, Python, Go, Java, Docker) are assumed.
name: asdlc-run
run-name: "asdlc ${{ inputs.ticket }} ${{ inputs.execution }}"

on:
  workflow_dispatch:
    inputs:
      execution: { description: "ASDLC execution id", required: true, type: string }
      ticket: { description: "Ticket id", required: true, type: string }
      server: { description: "ASDLC orchestrator base URL", required: true, type: string }

permissions: {}

concurrency:
  group: asdlc-${{ inputs.ticket }}
  cancel-in-progress: false

env:
  EXECUTION: ${{ inputs.execution }}
  TICKET: ${{ inputs.ticket }}
  SERVER: ${{ inputs.server }}
  CLAUDE_CODE_VERSION: 2.1.286
  # Writes the orchestrator's harness ({ref, files: {path: text}, profile}) under .asdlc-harness/
  # and the profile to the file named by the second argument.
  WRITE_HARNESS: |
    const fs = require("fs"), path = require("path");
    const h = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
    for (const [f, text] of Object.entries(h.files)) {
      if (!/^harness\/[\w./-]+$/.test(f) || f.includes("..")) throw new Error("bad harness path " + f);
      const out = path.join(".asdlc-harness", f);
      fs.mkdirSync(path.dirname(out), { recursive: true });
      fs.writeFileSync(out, text);
    }
    if (process.argv[2] && h.profile) fs.writeFileSync(process.argv[2], JSON.stringify(h.profile));
    console.log("harness", h.ref, Object.keys(h.files).join(", "), h.profile ? "profile " + h.profile.hash : "no profile");

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    outputs:
      start_sha: ${{ steps.claim.outputs.start_sha }}
      stage: ${{ steps.claim.outputs.stage }}
    steps:
      - name: Validate inputs
        run: |
          echo "ASDLC_PROFILE=$RUNNER_TEMP/profile.json" >> "$GITHUB_ENV"
          [[ "$EXECUTION" =~ ^E-[0-9a-f-]{36}$ ]] || { echo "bad execution id"; exit 1; }
          [[ "$TICKET" =~ ^T-[0-9]+$ ]] || { echo "bad ticket id"; exit 1; }
          [[ "$SERVER" =~ ^https:// ]] || { echo "server must be https"; exit 1; }

      - name: Claim execution
        id: claim
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=asdlc" | jq -r .value)
          curl -sS --fail-with-body -X POST "$SERVER/github/claim" \
            -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' \
            -d "{\"execution\":\"$EXECUTION\"}" -o "$RUNNER_TEMP/claim.json"
          TOKEN=$(jq -r .token "$RUNNER_TEMP/claim.json")
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/proxy-token"
          jq .spec "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/spec.json"
          jq '.harness + {profile: .profile}' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/harness.json"
          jq -r .agent.prompt "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/prompt.md"
          jq -r '.agent.model' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/model"
          jq -r '.agent.maxTurns' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/max-turns"
          jq -r '.agent.allowedTools' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/allowed-tools"
          echo "start_sha=$(jq -r .startSha "$RUNNER_TEMP/claim.json")" >> "$GITHUB_OUTPUT"
          echo "stage=$(jq -r .stage "$RUNNER_TEMP/claim.json")" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/claim.json"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.claim.outputs.start_sha }}
          persist-credentials: false

      - name: Install harness
        run: node -e "$WRITE_HARNESS" "$RUNNER_TEMP/harness.json" "$ASDLC_PROFILE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Project setup (from the profile)
        run: |
          node .asdlc-harness/harness/run.mjs setup
          node .asdlc-harness/harness/run.mjs export-env >> "$GITHUB_ENV"

      - name: Start services and prepare data (from the profile)
        run: node .asdlc-harness/harness/run.mjs up

      - name: Run Claude Code
        run: |
          set -uo pipefail
          mkdir -p .asdlc "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/spec.json" .asdlc/spec.json
          KEY=$(cat "$RUNNER_TEMP/proxy-token"); rm "$RUNNER_TEMP/proxy-token"
          # Claude Code talks to a localhost relay that base64-encodes each call on its way to the
          # orchestrator: Render's edge firewall blocks request text that looks like an attack
          # (e.g. "OR 1=1" in a test file), which would cut the agent off mid-run.
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL -u ACTIONS_CACHE_URL -u GITHUB_TOKEN \
            node .asdlc-harness/harness/run.mjs llm-shim & SHIM=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8787/shim-health >/dev/null && break; sleep 0.25; done
          # Commands the model runs get no OIDC, artifact or cache credentials from this job.
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL -u ACTIONS_CACHE_URL -u GITHUB_TOKEN \
            ANTHROPIC_BASE_URL="http://127.0.0.1:8787" ANTHROPIC_API_KEY="$KEY" \
            ANTHROPIC_DEFAULT_HAIKU_MODEL=claude-haiku-5-5 ANTHROPIC_SMALL_FAST_MODEL=claude-haiku-5-5 \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 DISABLE_TELEMETRY=1 DISABLE_AUTOUPDATER=1 \
            ASDLC_TEST_DIR="e2e/asdlc/$TICKET" \
            npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" -p "$(cat "$RUNNER_TEMP/prompt.md")" \
              --model "$(cat "$RUNNER_TEMP/model")" --max-turns "$(cat "$RUNNER_TEMP/max-turns")" \
              --allowedTools "$(cat "$RUNNER_TEMP/allowed-tools")" --output-format json \
              > "$RUNNER_TEMP/claude.json" || echo "::warning::Claude Code exited with $?"
          unset KEY
          kill "$SHIM" 2>/dev/null || true
          jq -r '.result // ""' "$RUNNER_TEMP/claude.json" > "$RUNNER_TEMP/out/summary.md" || true
          jq '{subtype, num_turns, duration_ms, is_error}' "$RUNNER_TEMP/claude.json" || true

      - name: Stop services
        if: always()
        run: node .asdlc-harness/harness/run.mjs down || true

      - name: Package changes as a patch
        run: |
          printf '.asdlc/\n.asdlc-harness/\nnode_modules/\ntest-results/\nplaywright-report/\n' >> .git/info/exclude
          git add -A
          git diff --cached --binary HEAD > "$RUNNER_TEMP/out/changes.patch"
          git diff --cached --stat HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: ${{ runner.temp }}/out/
          retention-days: 14

  check:
    name: check
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      STAGE: ${{ needs.agent.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.start_sha }}
          persist-credentials: false

      - name: Fetch trusted harness and the ticket's profile
        run: |
          set -euo pipefail
          echo "ASDLC_PROFILE=$RUNNER_TEMP/profile.json" >> "$GITHUB_ENV"
          export ASDLC_PROFILE="$RUNNER_TEMP/profile.json"
          curl -sS --fail-with-body "$SERVER/github/harness?execution=$EXECUTION" -o "$RUNNER_TEMP/harness.json"
          node -e "$WRITE_HARNESS" "$RUNNER_TEMP/harness.json" "$ASDLC_PROFILE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Project setup (from the profile)
        run: |
          node .asdlc-harness/harness/run.mjs setup
          node .asdlc-harness/harness/run.mjs export-env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent

      - name: Apply patch and run checks
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          PATCH="$RUNNER_TEMP/agent/changes.patch" OUT="$RUNNER_TEMP/check" \
            node .asdlc-harness/harness/run.mjs check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-output
          path: |
            ${{ runner.temp }}/check/check.json
            ${{ runner.temp }}/check/app.log
          retention-days: 14

  report:
    name: report
    needs: [agent, check]
    if: always() && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: ${{ needs.agent.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.start_sha }}
          persist-credentials: false

      - name: Fetch trusted harness and the ticket's profile
        run: |
          set -euo pipefail
          echo "ASDLC_PROFILE=$RUNNER_TEMP/profile.json" >> "$GITHUB_ENV"
          export ASDLC_PROFILE="$RUNNER_TEMP/profile.json"
          curl -sS --fail-with-body "$SERVER/github/harness?execution=$EXECUTION" -o "$RUNNER_TEMP/harness.json"
          node -e "$WRITE_HARNESS" "$RUNNER_TEMP/harness.json" "$ASDLC_PROFILE"

      - uses: actions/download-artifact@v4
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: check-output
          path: ${{ runner.temp }}/check

      - name: Report to ASDLC
        run: |
          PATCH="$RUNNER_TEMP/agent/changes.patch" OUT="$RUNNER_TEMP/check" SUMMARY="$RUNNER_TEMP/agent/summary.md" \
            node .asdlc-harness/harness/run.mjs report
