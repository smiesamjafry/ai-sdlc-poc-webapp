# Render Blueprint for Pocket Shop. Production was created from these settings; attach this file
# as a Blueprint in the Render dashboard to enable manual PR previews (title contains [render preview]).
# SEED_ADMIN_PASSWORD and SEED_STAFF_PASSWORD are set by hand in the dashboard, never committed.
previews:
  generation: manual
  expireAfterDays: 3

services:
  - type: web
    name: pocket-shop-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci
    # start.ts runs migrations, seeds an empty database, then starts the API.
    startCommand: npm run start:prod -w server
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pocket-shop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pocket-shop-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pocket-shop-41pq.onrender.com
      - key: PREVIEW_ORIGINS
        value: https://smiesamjafry.github.io
      - key: STOREFRONT_URL
        value: https://pocket-shop-41pq.onrender.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false

  - type: web
    name: pocket-shop
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://pocket-shop-api-c15t.onrender.com

  - type: keyvalue
    name: pocket-shop-cache
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: pocket-shop-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: pocket
    user: pocket
